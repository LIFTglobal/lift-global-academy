<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFT Global Academy — Reset password</title>
<link rel="stylesheet" href="lift-style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .login-logo { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 16px; display: block; }
</style>
</head>
<body>

<div class="center-page">

<div class="card" id="checking-card" style="max-width:380px; width:100%; text-align:center;">
  <div class="spinner"></div>
  Checking your reset link...
</div>

<div class="card" id="reset-card" style="display:none; max-width:380px; width:100%;">
  <img class="login-logo" src="lift-logo.png" alt="LIFT Global Academy logo">
  <h1 style="text-align:center;">Set a new password</h1>
  <div class="subtitle" style="text-align:center; margin-bottom:28px;">Choose a new password for your account.</div>
  <div class="error" id="reset-error"></div>
  <form id="reset-form">
    <label for="new-password">New password</label>
    <input type="password" id="new-password" required autocomplete="new-password" minlength="6">
    <label for="confirm-password">Confirm new password</label>
    <input type="password" id="confirm-password" required autocomplete="new-password" minlength="6">
    <button type="submit" id="reset-button" style="width:100%; margin-top:18px;">Set new password</button>
  </form>
</div>

<div class="card success-screen" id="success-card" style="display:none; max-width:380px; width:100%; text-align:center;">
  <h1>Password updated</h1>
  <div class="subtitle">You can now sign in with your new password.</div>
  <a href="lift_login.html"><button style="width:100%; margin-top:20px;">Go to sign in</button></a>
</div>

<div class="card" id="invalid-card" style="display:none; max-width:380px; width:100%; text-align:center;">
  <h1>Link expired or invalid</h1>
  <div class="subtitle">This password reset link is no longer valid. Request a new one from the sign in page.</div>
  <a href="lift_login.html"><button style="width:100%; margin-top:20px;">Back to sign in</button></a>
</div>

</div>

<script>
  const SUPABASE_URL = "https://ojmqlvtyygvethwrdqon.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbXFsdnR5eWd2ZXRod3JkcW9uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MzEyMTQsImV4cCI6MjA5ODAwNzIxNH0.IWLrhtb4w_dq-_pjW1wzRAX6-0qI4Hmwtp5p_cSSVWM";

  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const checkingCard = document.getElementById("checking-card");
  const resetCard = document.getElementById("reset-card");
  const successCard = document.getElementById("success-card");
  const invalidCard = document.getElementById("invalid-card");
  const resetForm = document.getElementById("reset-form");
  const resetButton = document.getElementById("reset-button");
  const resetError = document.getElementById("reset-error");

  let recoveryReady = false;

  function showResetForm() {
    if (recoveryReady) return;
    recoveryReady = true;
    checkingCard.style.display = "none";
    resetCard.style.display = "block";
  }

  // supabase-js automatically parses the recovery token out of the URL and
  // fires this event once a recovery session is established.
  client.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY" && session) {
      showResetForm();
    }
  });

  // Fallback: if the event already fired before this listener attached,
  // a session will already be present.
  setTimeout(async () => {
    if (recoveryReady) return;
    const { data } = await client.auth.getSession();
    if (data.session) {
      showResetForm();
    } else {
      checkingCard.style.display = "none";
      invalidCard.style.display = "block";
    }
  }, 2500);

  resetForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    resetError.style.display = "none";

    const newPassword = document.getElementById("new-password").value;
    const confirmPassword = document.getElementById("confirm-password").value;

    if (newPassword !== confirmPassword) {
      resetError.textContent = "Passwords don't match.";
      resetError.style.display = "block";
      return;
    }

    resetButton.disabled = true;
    resetButton.textContent = "Saving...";

    const { error } = await client.auth.updateUser({ password: newPassword });

    resetButton.disabled = false;
    resetButton.textContent = "Set new password";

    if (error) {
      resetError.textContent = error.message;
      resetError.style.display = "block";
      return;
    }

    resetCard.style.display = "none";
    successCard.style.display = "block";
  });
</script>

</body>
</html>
